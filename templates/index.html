<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anton Vasiliev</title>
<meta name="description" content="Anton Vasiliev — Python Backend Developer.">
<meta name="theme-color" content="#121218">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23121218%22/><text x=%2250%22 y=%2266%22 font-size=%2254%22 font-family=%22monospace%22 font-weight=%22700%22 fill=%22%23ffcf33%22 text-anchor=%22middle%22>A</text></svg>">
<link rel="stylesheet" href="/static/css/shared.css">
<link rel="stylesheet" href="/static/css/classic.css">
</head>
<body>

<div id="classic" data-theme="night">
  <div id="c-sky-layer" aria-hidden="true"></div>
  <div id="c-cityscape" aria-hidden="true"></div>
  <header id="c-topbar">
    <div id="c-brand">
      <span id="c-brand-name">Anton Vasiliev</span>
      <span id="c-brand-role">Python Backend Developer</span>
    </div>
    <div id="c-controls">
      <a class="c-btn" id="c-pdf" href="/dossier" target="_blank" data-ru="PDF" data-en="PDF">PDF</a>
      <button class="c-btn" id="c-theme-btn" title="Night/day">🌙</button>
      <button class="c-btn" id="c-lang-btn">RU</button>
      <a class="c-btn c-btn-accent" id="c-mode-btn" href="/xp" data-ru="🖥 XP-версия" data-en="🖥 XP version">🖥 XP-версия</a>
    </div>
  </header>
  <main id="c-main"></main>
  <footer id="c-footer"></footer>
</div>

<div id="bsod" hidden>
  <div>:(</div>
  <div style="margin-top:14px" data-ru="Ваш браузер столкнулся с проблемой: слишком крутое резюме." data-en="Your PC ran into a problem: this résumé was too impressive.">Ваш браузер столкнулся с проблемой: слишком крутое резюме.</div>
  <div style="margin-top:8px" data-ru="Собираем немного информации об ошибке, а потом перезапустим для вас этот сайт." data-en="We're just collecting some error info, then we'll restart this site for you.">Собираем немного информации об ошибке, а потом перезапустим для вас этот сайт.</div>
  <div class="bsod-hint" data-ru="0% завершено — нажмите в любом месте или Esc, чтобы вернуться" data-en="0% complete — click anywhere or press Esc to go back">0% завершено — нажмите в любом месте или Esc, чтобы вернуться</div>
</div>

<div id="shutdown-screen" hidden>
  <div class="shutdown-spinner"></div>
  <div data-ru="Перезагрузка в XP-версию…" data-en="Rebooting into the XP version…">Перезагрузка в XP-версию…</div>
</div>

<canvas id="matrix-canvas" hidden></canvas>
<canvas id="confetti-canvas"></canvas>
<div id="toast"></div>

<script id="site-data" type="application/json">{{ site_data_json | safe }}</script>
<script src="/static/js/app.js"></script>
<script src="/static/js/terminal.js"></script>
<script src="/static/js/games.js"></script>
<script src="/static/js/classic.js"></script>
</body>
</html>
